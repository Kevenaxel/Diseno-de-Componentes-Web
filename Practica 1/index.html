<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Practicos del DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tarjeta">
        <h3>Generador de Saludos</h3>
        <input type="text" id="nombreUsuario" placeholder="Escriba su nombre"> <!--Informacion sobre cuadro-->
        <button id="btnSaludar">Saludar</button> <!--Etiqueta Boton Presionar-->
        <p id="mensaje" style="color: #0b3d5f"></p>
    </div>
    <div class="tarjeta">
        <h3>Ejercicio de Suscripcion</h3>
        <form id="formSuscripcion">
            <label for="correoUsuario">Correo Electronico: </label>
            <input type="email" id="correoUsuario" placeholder="ejemplo@ejemplo.com" required>
            <button type="submit"> SUscribirme</button>
        </form>
        <p id="mensajeEnviado" style="color: #198754"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
